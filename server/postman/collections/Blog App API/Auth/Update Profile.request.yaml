$kind: http-request
name: Update Profile
method: PUT
url: '{{baseUrl}}/api/auth/profile'
order: 4000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe Updated",
      "bio": "Updated bio",
      "avatar": "https://example.com/avatar.jpg"
    }
