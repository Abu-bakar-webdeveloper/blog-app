$kind: http-request
name: Update Report Status
description: 'Admin only. Valid statuses: PENDING, REVIEWED, RESOLVED, DISMISSED'
method: PUT
url: '{{baseUrl}}/api/reports/:reportId/status'
order: 2000
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "REVIEWED"
    }
